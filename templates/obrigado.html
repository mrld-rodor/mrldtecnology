{% extends "base.html" %}
{% block title %}Pedido Recebido | Amiraldo Rodrigues{% endblock %}
{% block content %}
<section class="py-20 bg-gradient-to-b from-[#dbeafe] to-[#f8fafc] min-h-screen flex items-center justify-center">
    <div class="max-w-lg mx-auto bg-white/70 backdrop-blur-xl p-10 rounded-3xl border border-white/80 shadow-xl text-center">
        <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h1 class="font-accent text-3xl font-extrabold text-gray-900 mb-4">Pedido Recebido!</h1>
        <p class="text-gray-600 mb-2">Obrigado, <strong>{{ nome }}</strong>!</p>
        <p class="text-gray-600 mb-6">Referência: <strong>{{ ref }}</strong></p>
        <p class="text-gray-600 mb-6">Enviámos uma confirmação para <strong>{{ email }}</strong>. Responderemos em <strong>{{ prazo }}</strong>.</p>
        <a href="{{ url_for('main.home') }}" class="btn-shine inline-block bg-brand-blue text-white px-8 py-3 rounded-full font-bold hover:bg-blue-800 transition-all">Voltar ao Início</a>
    </div>
</section>
{% endblock %}
